name: extract-chain
version: 0.3.1
description: "web_extract fallback chain: Jina -> Bright Data -> Firecrawl (live) -> Keenable (index copy), Tavily optional; checks each result against Keenable's copy, with notes for the model"
author: "Pressimize and Claude (Anthropic)"
license: MIT
homepage: "https://github.com/Pressimize/hermes-extract-chain"
kind: backend
requires_hermes: ">=0.21"
provides_web_providers:
  - extract-chain
requires_env:
  - name: BRIGHTDATA_API_KEY
    description: "Bright Data API key (Web Unlocker; stage skipped if unset)"
    secret: true
  - name: BRIGHTDATA_UNLOCKER_ZONE
    description: "Name of the Bright Data Web Unlocker zone (stage skipped if unset)"
  - name: FIRECRAWL_API_KEY
    description: "Firecrawl API key (stage skipped if unset)"
    secret: true
  - name: KEENABLE_API_KEY
    description: "Keenable API key (reference copy and last stage; skipped if unset)"
    secret: true
optional_env:
  - name: TAVILY_API_KEY
    description: "Tavily API key (only used when EXTRACT_CHAIN_ORDER names tavily)"
    secret: true
  - name: JINA_API_KEY
    description: "Jina Reader API key (optional; without it Jina allows 20 requests per minute)"
    secret: true
  - name: EXTRACT_CHAIN_ORDER
    description: "Stage order, comma-separated (default jina,brightdata,firecrawl,keenable; tavily optional); Keenable always last"
